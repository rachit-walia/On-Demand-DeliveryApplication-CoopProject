<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>RapidRush — On-Demand Delivery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    :root{
      --bg:#09090E;--bg2:#0F0F17;--bg3:#14141E;--card:#111119;
      --border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.1);
      --orange:#FF5722;--orange2:#FF8A65;--orange-glow:rgba(255,87,34,0.18);
      --green:#00C853;--green2:#69F0AE;
      --gold:#FFD600;--blue:#2979FF;--red:#FF1744;
      --text:#F5F5F7;--text2:#8E8EA0;--text3:#4A4A5A;
      --radius:18px;--radius-sm:12px;
      --shadow-card:0 4px 24px rgba(0,0,0,0.45);
      --glow-orange:0 0 60px rgba(255,87,34,0.2);
      --font-display:'Bricolage Grotesque',sans-serif;
      --font-body:'Plus Jakarta Sans',sans-serif;
    }
    html{scroll-behavior:smooth;}
    body{font-family:var(--font-body);background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;}
    ::-webkit-scrollbar{width:5px;}
    ::-webkit-scrollbar-track{background:var(--bg2);}
    ::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:3px;}
    button,input,textarea,select{font-family:inherit;}
    @keyframes pulse-ring{0%{transform:scale(0.95);box-shadow:0 0 0 0 rgba(255,87,34,0.4);}70%{transform:scale(1);box-shadow:0 0 0 10px rgba(255,87,34,0);}100%{transform:scale(0.95);box-shadow:0 0 0 0 rgba(255,87,34,0);}}
    @keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-12px);}}
    @keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
    @keyframes slideUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
    @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
    @keyframes spin{to{transform:rotate(360deg);}}
    @keyframes ticker{0%{transform:translateX(0);}100%{transform:translateX(-50%);}}
  </style>
</head>
<body><div id="root"></div></body>
</html>
